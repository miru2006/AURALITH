<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tourist Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0a0f2c, #1b1f44);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 600px;
      height: 85vh;
      background: #0d1326;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,50,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #11183f;
      color: #f0f8ff;
      padding: 15px;
      font-size: 20px;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px #4d6fff;
    }

    #lang {
      margin: 10px;
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid #333c6b;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      background: #1a1f44;
      color: #f0f8ff;
      box-shadow: 0 0 8px #4d6fff;
    }

    #chatbox {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #0c0f27;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 75%;
      word-wrap: break-word;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      line-height: 1.4;
    }

    .user {
      background: #1a1f44;
      color: #f0f8ff;
      align-self: flex-end;
      border-bottom-right-radius: 0;
      flex-direction: row-reverse;
      box-shadow: 0 0 6px #4d6fff;
    }

    .bot {
      background: #11183f;
      color: #f0f8ff;
      align-self: flex-start;
      border-bottom-left-radius: 0;
      box-shadow: 0 0 6px #4d6fff;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      color: #f0f8ff;
      box-shadow: 0 0 5px #4d6fff;
    }

    #input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #333c6b;
      background: #11183f;
      gap: 10px;
    }

    #msg {
      flex: 1;
      padding: 12px 16px;
      border-radius: 25px;
      border: 1px solid #333c6b;
      outline: none;
      font-size: 14px;
      background: #1a1f44;
      color: #f0f8ff;
      box-shadow: inset 0 0 6px #4d6fff;
    }

    #send-btn {
      padding: 10px 20px;
      background: #11183f;
      color: #f0f8ff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.3s, box-shadow 0.3s;
      box-shadow: 0 0 8px #4d6fff;
    }

    #send-btn:hover {
      background: #0c0f27;
      box-shadow: 0 0 12px #6f8fff;
    }

    /* Typing animation */
    .typing {
      width: 40px;
      height: 20px;
      display: flex;
      gap: 5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #f0f8ff;
      border-radius: 50%;
      animation: blink 1.4s infinite both;
      box-shadow: 0 0 6px #4d6fff;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>🤖 Tourist Chatbot</header>

    <select id="lang">
      <option value="English" selected>English</option>
      <option value="Tamil">Tamil</option>
      <option value="Hindi">Hindi</option>
    </select>

    <div id="chatbox"></div>

    <div id="input-area">
      <input 
        type="text" 
        id="msg" 
        placeholder="Type your question..." 
        onkeydown="if(event.key==='Enter'){sendMsg()}">
      <button id="send-btn" onclick="sendMsg()">Send</button>
    </div>
  </div>

  <script>
    async function sendMsg() {
      const msg = document.getElementById("msg").value.trim();
      const lang = document.getElementById("lang").value;
      if (!msg) return;

      const chatbox = document.getElementById("chatbox");

      // Show user message
      chatbox.innerHTML += `
        <div class="msg user">
          <div class="avatar">🧑</div>${msg}
        </div>`;
      chatbox.scrollTop = chatbox.scrollHeight;

      document.getElementById("msg").value = "";

      // Typing animation
      const typingDiv = document.createElement("div");
      typingDiv.className = "msg bot";
      typingDiv.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="typing">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>`;
      chatbox.appendChild(typingDiv);
      chatbox.scrollTop = chatbox.scrollHeight;

      try {
        // Send request to backend
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg, language: lang })
        });

        const data = await res.json();

        // Replace typing animation with reply
        typingDiv.innerHTML = `
          <div class="avatar">🤖</div>${data.reply}`;
      } catch (err) {
        typingDiv.innerHTML = `
          <div class="avatar">🤖</div>
          <i>Error connecting to server</i>`;
      }

      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>
